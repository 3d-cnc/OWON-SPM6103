<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1115">
<title>SPM6103 Fernanzeige</title>
<style>
  /* Fernanzeige fürs Handy (SPM-27): fragt einmal je Sekunde /daten ab. Kommt vom Programm, nur im eigenen Netz. */
  :root { --bg: #0e1115; --panel: #161a20; --line: #2a313b; --text: #e6e9ee; --muted: #8b95a3;
    --u: #f5c542; --i: #4fc3f7; --p: #ef7d6c; --d: #7ddc8a; --ok: #3ecf72; --warn: #ffa94d; --err: #ff5c5c; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  .punkt { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .punkt.an { background: var(--ok); box-shadow: 0 0 8px var(--ok); } .punkt.demo { background: var(--warn); } .punkt.weg { background: var(--err); }
  #status { color: var(--muted); font-size: 13px; }
  .karten { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .karte { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .karte.breit { grid-column: 1 / -1; }
  .name { color: var(--muted); font-size: 12px; }
  .wert { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 34px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .wert small { font-size: 15px; color: var(--muted); margin-left: 4px; }
  .u .wert { color: var(--u); } .i .wert { color: var(--i); } .p .wert { color: var(--p); } .d .wert { color: var(--d); }
  .zeile { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .marke { font-size: 13px; font-weight: 600; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .marke.gruen { color: var(--ok); border-color: var(--ok); } .marke.gelb { color: var(--warn); border-color: var(--warn); }
  #alarm { display: none; background: var(--err); color: #fff; font-weight: 700; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  canvas { display: block; width: 100%; height: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
  #notaus { display: none; width: 100%; margin-top: 12px; padding: 16px; font-size: 18px; font-weight: 800; color: #fff; background: var(--err); border: 0; border-radius: 12px; }
  #code-form { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  #code-form input { font-size: 22px; width: 100%; padding: 8px; margin: 8px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); letter-spacing: 4px; text-align: center; }
  #code-form button { width: 100%; padding: 10px; font-size: 16px; border-radius: 8px; border: 0; background: var(--i); color: #06222f; font-weight: 700; }
  .fuss { color: var(--muted); font-size: 12px; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<header><span class="punkt" id="punkt"></span><h1>OWON SPM6103</h1><span id="status">verbinde …</span></header>
<div id="alarm"></div>
<form id="code-form"><div>Zugangscode aus dem Programm (Menü → Fernanzeige im WLAN):</div><input id="code" inputmode="numeric" autocomplete="off" maxlength="6"><button>Öffnen</button></form>
<div id="inhalt">
  <div class="karten">
    <div class="karte u"><div class="name">Spannung</div><div class="wert"><span id="u">–</span><small>V</small></div></div>
    <div class="karte i"><div class="name">Strom</div><div class="wert"><span id="i">–</span><small>A</small></div></div>
    <div class="karte p"><div class="name">Leistung</div><div class="wert"><span id="p">–</span><small>W</small></div></div>
    <div class="karte"><div class="name">Sollwerte</div><div id="soll" style="font-family: ui-monospace, monospace; font-size: 14px; margin-top: 6px">–</div></div>
    <div class="karte d breit"><div class="name" id="dmm-name">Multimeter</div><div class="wert"><span id="dmm">–</span></div></div>
  </div>
  <div class="zeile" id="marken"></div>
  <canvas id="kurve"></canvas>
  <button id="notaus" type="button">AUSGANG AUS</button>
</div>
<div class="fuss">Aktualisiert sich jede Sekunde · nur lesen<span id="fuss-notaus"></span></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const zahl = (x, n) => Number.isFinite(x) ? x.toLocaleString('de-DE', { minimumFractionDigits: n, maximumFractionDigits: n, useGrouping: false }) : '–';
let letzte = null, fehlerFolge = 0;

// Code aus der Adresse (QR-Code) übernehmen – das Programm setzt dann ein Cookie, die Adresse wird aufgeräumt
const q = new URLSearchParams(location.search);
if (q.has('code')) history.replaceState(null, '', location.pathname);

$('code-form').addEventListener('submit', e => { e.preventDefault(); location.href = '?code=' + encodeURIComponent($('code').value.trim()); });

async function holen() {
  try {
    const r = await fetch('daten', { cache: 'no-store', credentials: 'same-origin' });
    if (r.status === 401) { $('code-form').style.display = 'block'; $('inhalt').style.display = 'none'; $('status').textContent = 'Code nötig'; return; }
    if (r.status === 429) { $('status').textContent = 'zu viele falsche Codes – kurz warten'; return; }
    letzte = await r.json(); fehlerFolge = 0;
    zeigen(letzte);
  } catch {
    fehlerFolge++;
    $('punkt').className = 'punkt weg';
    $('status').textContent = fehlerFolge > 2 ? 'Programm nicht erreichbar' : 'verbinde …';
  }
}

function zeigen(d) {
  $('code-form').style.display = 'none'; $('inhalt').style.display = 'block';
  const alt = Date.now() - d.t > 5000;
  $('punkt').className = 'punkt ' + (alt ? 'weg' : d.demo ? 'demo' : d.verbunden ? 'an' : '');
  $('status').textContent = alt ? 'keine frischen Werte' : d.demo ? 'Demo-Modus' : d.verbunden ? 'live' : 'Netzteil nicht verbunden';
  $('u').textContent = zahl(d.u, 3); $('i').textContent = zahl(d.i, 3); $('p').textContent = zahl(d.p, Math.abs(d.p) >= 100 ? 2 : 3);
  $('soll').innerHTML = d.soll ? `${zahl(d.soll.volt, 3)} V<br>${zahl(d.soll.curr, 3)} A` : '–';
  $('dmm').textContent = d.dmm ?? '–'; $('dmm-name').textContent = d.dmmName ? 'Multimeter · ' + d.dmmName : 'Multimeter';
  const modus = { 0: 'Standby', 1: 'CV', 2: 'CC', 3: 'Fehler' }[d.modus];
  const marken = [`<span class="marke ${d.ausgang ? 'gruen' : ''}">Ausgang ${d.ausgang ? 'EIN' : 'AUS'}</span>`];
  if (modus) marken.push(`<span class="marke ${d.modus === 1 ? 'gruen' : d.modus === 2 ? 'gelb' : ''}">${modus}</span>`);
  for (const a of d.automatik ?? []) marken.push(`<span class="marke gruen">${a.replace(/[<>&]/g, '')}</span>`);
  $('marken').innerHTML = marken.join('');
  $('alarm').style.display = d.alarm ? 'block' : 'none'; $('alarm').textContent = d.alarm ?? '';
  $('notaus').style.display = d.notaus && d.ausgang ? 'block' : 'none';
  $('fuss-notaus').textContent = d.notaus ? ' · Ausgang-aus erlaubt' : '';
  kurve(d.verlauf ?? []);
}

// Spannung (gelb, linke Skala) und Strom (blau, rechte Skala) der letzten zwei Minuten
function kurve(punkte) {
  const c = $('kurve'), dpr = devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  if (punkte.length < 2) { g.fillStyle = '#8b95a3'; g.font = '13px system-ui'; g.fillText('Noch keine Kurve', 10, 22); return; }
  const t0 = punkte[0][0], t1 = punkte.at(-1)[0];
  const linie = (k, farbe) => {
    const werte = punkte.map(p => p[k]).filter(Number.isFinite);
    let lo = Math.min(...werte), hi = Math.max(...werte);
    if (hi - lo < 1e-3) { lo -= 0.01; hi += 0.01; }
    g.strokeStyle = farbe; g.lineWidth = 2; g.beginPath();
    punkte.forEach((p, n) => {
      if (!Number.isFinite(p[k])) return;
      const x = 6 + (p[0] - t0) / Math.max(1, t1 - t0) * (w - 12), y = h - 18 - (p[k] - lo) / (hi - lo) * (h - 30);
      n ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
    g.fillStyle = farbe; g.font = '11px ui-monospace, monospace';
    g.fillText(`${zahl(hi, 2)}`, k === 1 ? 6 : w - 50, 12);
  };
  linie(1, '#f5c542'); linie(2, '#4fc3f7');
  g.fillStyle = '#8b95a3'; g.font = '11px system-ui'; g.fillText('letzte 2 min · gelb U · blau I', 6, h - 4);
}

$('notaus').addEventListener('click', async () => {
  if (!confirm('Ausgang des Netzteils jetzt ausschalten?')) return;
  const r = await fetch('aus', { method: 'POST', credentials: 'same-origin' });
  $('status').textContent = r.ok ? 'Ausgang aus gesendet' : 'nicht erlaubt';
});

holen();
setInterval(holen, 1000);
</script>
</body>
</html>
